name: 'JS - Tests'

on:
  push:
    branches: [ master ]
    paths:
      - javascript/**
  pull_request:
    branches: [ master ]
    paths:
      - javascript/**
  workflow_dispatch:

defaults:
  run:
    working-directory: ./javascript
jobs:
  test:
    name: JS - Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 18

      - name: Run linters
        run: |
          make check

      - name: Run unit tests
        run: |
          make test-unit

      - name: Run integration tests
        run: |
          make test-integration

      - name: Stop the cluster
        if: ${{ always() }}
        run: |
         make scylla-kill
